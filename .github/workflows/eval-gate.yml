name: CloudOps Sentinel - Automated Evaluation & Quality Gate

on:
  pull_request:
    branches: [main, master, evals-gemini]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  evaluation-gate:
    name: DeepEval & Ragas AI Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install deepeval ragas datasets pytest

      - name: Execute Master Evaluation Suite (All Categories)
        working-directory: ./backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m evals.run_all_evals --category all --samples 3

      - name: Run Red-Teaming Safety Invariant Check
        working-directory: ./backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONPATH: .
        run: |
          python -m evals.test_safety_evals
